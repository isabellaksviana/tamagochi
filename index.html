<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamagochi</title>
    <meta name="description" content="Um bichinho virtual com cara de portátil retrô: adote um ovo, cuide e veja crescer." />
    <!-- o ícone quando alguém adiciona o jogo à tela inicial do celular -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e6def7" />
    <!-- a prévia do link (WhatsApp, redes): título, frase e a imagem com os 5 bichos -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tamagochi.isabellaviana.com/" />
    <meta property="og:title" content="Tamagochi" />
    <meta property="og:description" content="Adote, cuide e veja crescer. Um bichinho virtual com cara de portátil retrô." />
    <meta property="og:image" content="https://tamagochi.isabellaviana.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Silkscreen (pixel) no nome e nos números; Inter no resto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // escolhe o tema antes de a página aparecer (senão ela pisca no tema errado):
      // o que a pessoa escolheu no botão; se nunca escolheu, o do sistema
      const temaSalvo = localStorage.getItem('tema')
      const sistemaClaro = matchMedia('(prefers-color-scheme: light)').matches
      document.documentElement.dataset.theme = temaSalvo ?? (sistemaClaro ? 'light' : 'dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
